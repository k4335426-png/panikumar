<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            background-color: yellow;
            border-color: red;
            border: 70%;
        }
        
        box.container {
            width: 70%;
            margin: auto;
            padding: 20px;
            box-shadow: 5px 4px 1px red;
            border: 23px 23px red;
        }
        
        .a {
            text-align: center;
            background-color: pink;
            font-size: 30px;
            box-shadow: 5px 5px 10px red;
            padding: 30px;
            border-top-right-radius: 40px;
            border-bottom-left-radius: 40px;
        }
        
        button {
            background-color: red;
            font-size: 30px;
            padding: 10px;
            margin-left: 100px;
            cursor: pointer;
            border-top-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }
        
        .box {
            display: inline-block;
            width: 50px;
            height: 50px;
            border-color: yellow;
            background-color: greenyellow;
            padding-left: 5px;
            padding-right: 5px;
            padding-bottom: 5px;
            padding-top: 5px;
            margin: 5px 5px 5px 5px;
        }
    </style>
</head>

<body>
    <div class="a">
        <ul>
            <center>hellow</center>
        </ul>
    </div>


    <button id="button">serch</button>
    <p id="message"></p>
    <script>
        let button = document.getElementById("button");
        let message = document.getElementById("message");
        button.addEventListener("click", function() {
            message.textContent = "the serch button was clicked";
        })
    </script>
    <hr>
    <div class="box">love</div>
    <div class="box">emotion</div>
</body>

</html>
